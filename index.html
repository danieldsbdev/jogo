<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bug Hunter - Mobile Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 750px;
            background: linear-gradient(to bottom, #1e1b4b, #0f172a);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            border-left: 2px solid #334155;
            border-right: 2px solid #334155;
        }
        canvas {
            display: block;
            background: transparent;
            width: 100%;
            height: 100%;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }
        .header {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .score-box {
            background: rgba(30, 41, 59, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #475569;
        }
        #start-screen, #gameover-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            text-align: center;
            padding: 30px;
            z-index: 10;
        }
        h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 1rem;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: transform 0.1s, background 0.2s;
            text-transform: uppercase;
        }
        .btn:active {
            transform: scale(0.95);
        }
        #gameover-screen {
            display: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-layer">
            <div class="header">
                <div class="score-box">Score: <span id="score">0</span></div>
                <div class="score-box">Recorde: <span id="highscore">0</span></div>
            </div>
        </div>

        <div id="start-screen">
            <h1>Bug Hunter</h1>
            <p>Toque na tela para pular e desviar dos bugs no sistema. Mantenha o código limpo e chegue na produção!</p>
            <button class="btn" onclick="startGame()">Jogar</button>
        </div>

        <div id="gameover-screen">
            <h1>Game Over</h1>
            <p>O sistema caiu! Deu Segmentation Fault.<br>Pontuação final: <span id="final-score">0</span></p>
            <button class="btn" onclick="startGame()">Tentar de Novo</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Ajustar resolução interna do canvas para alta nitidez em telas retina/mobile
        function resizeCanvas() {
            canvas.width = 400;
            canvas.height = 700;
        }
        resizeCanvas();

        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let highscore = localStorage.getItem('bug_hunter_highscore') || 0;
        document.getElementById('highscore').innerText = highscore;

        let player = {
            x: 80,
            y: 500,
            width: 40,
            height: 50,
            vy: 0,
            gravity: 0.8,
            jumpForce: -13,
            grounded: false
        };

        let obstacles = [];
        let particles = [];
        let frameCount = 0;
        let gameSpeed = 5;

        // Controles por Toque e Clique
        window.addEventListener('pointerdown', (e) => {
            if (gameState === 'PLAYING') {
                if (player.grounded) {
                    player.vy = player.jumpForce;
                    player.grounded = false;
                    createJumpParticles();
                }
            }
        });

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('gameover-screen').style.display = 'none';
            gameState = 'PLAYING';
            score = 0;
            gameSpeed = 5;
            obstacles = [];
            particles = [];
            player.y = 500;
            player.vy = 0;
            frameCount = 0;
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('final-score').innerText = Math.floor(score);
            if (score > highscore) {
                highscore = Math.floor(score);
                localStorage.setItem('bug_hunter_highscore', highscore);
                document.getElementById('highscore').innerText = highscore;
            }
            document.getElementById('gameover-screen').style.display = 'flex';
        }

        function createJumpParticles() {
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x: player.x + player.width / 2,
                    y: player.y + player.height,
                    vx: (Math.random() - 0.5) * 4,
                    vy: Math.random() * 3,
                    radius: Math.random() * 3 + 1,
                    alpha: 1
                });
            }
        }

        function spawnObstacle() {
            const types = ['bug', 'exception', 'syntax'];
            const type = types[Math.floor(Math.random() * types.length)];
            obstacles.push({
                x: canvas.width + 50,
                y: 520,
                width: 35,
                height: 35,
                type: type,
                speed: gameSpeed
            });
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            frameCount++;
            score += 0.1;
            document.getElementById('score').innerText = Math.floor(score);

            // Acelerar gradativamente
            gameSpeed = 5 + Math.floor(score / 50) * 0.5;

            // Física do Jogador
            player.vy += player.gravity;
            player.y += player.vy;

            const groundLevel = 550 - player.height;
            if (player.y >= groundLevel) {
                player.y = groundLevel;
                player.vy = 0;
                player.grounded = true;
            }

            // Gerar Obstáculos
            if (frameCount % Math.max(60 - Math.floor(score / 20), 30) === 0) {
                spawnObstacle();
            }

            // Atualizar Obstáculos
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                // Colisão (AABB simples)
                if (
                    player.x < obs.x + obs.width - 8 &&
                    player.x + player.width - 8 > obs.x &&
                    player.y < obs.y + obs.height - 8 &&
                    player.y + player.height - 8 > obs.y
                ) {
                    gameOver();
                }

                // Remover se saiu da tela
                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            // Atualizar Partículas
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar Linhas de Fundo (Código Estilizado)
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 550, canvas.width, 150);
            
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 550);
            ctx.lineTo(canvas.width, 550);
            ctx.stroke();

            // Desenhar Partículas
            for (let p of particles) {
                ctx.fillStyle = `rgba(56, 189, 248, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // Desenhar Jogador (Avatar Programador estilizado)
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            // Óculos / Detalhe tech
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(player.x + 22, player.y + 10, 12, 6);

            // Desenhar Obstáculos (Bugs)
            for (let obs of obstacles) {
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(obs.x + obs.width / 2, obs.y + obs.height / 2, obs.width / 2, 0, Math.PI * 2);
                ctx.fill();
                // Ícone do Bug
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px monospace';
                ctx.fillText('⚡', obs.x + 8, obs.y + 24);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
